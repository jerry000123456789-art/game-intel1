<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全球遊戲情報中心</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#e7eef8;background:#0b1422}*{box-sizing:border-box}body{max-width:1200px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:28px;margin:0}p{color:#9eacc1}.button{display:inline-block;background:#2c73db;color:white;text-decoration:none;padding:11px 15px;border-radius:9px}main{margin-top:25px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat,.item{background:#142238;border:1px solid #283c58;border-radius:12px;padding:15px}.stat b{display:block;font-size:25px;margin-top:8px}input,select{background:#142238;color:#fff;border:1px solid #38516f;border-radius:8px;padding:11px;width:100%}.filters{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:20px 0}.items{display:grid;gap:10px}.item h3{margin:7px 0;font-size:17px}.item a{color:#86b9ff;text-decoration:none}.small{font-size:12px;color:#a8b8cb}.tag{background:#294769;color:#b8dcff;padding:3px 8px;border-radius:20px;font-size:12px;margin-right:5px}#error{color:#ffb0b0}@media(max-width:600px){.filters{grid-template-columns:1fr}}
</style></head><body><header><div><h1>🎮 全球遊戲情報中心</h1><p>公開情報追蹤 · 台灣時間 UTC+8</p></div><a class="button" href="game_intel.xlsx" download>下載 Excel</a></header><main><div class="stats"><div class="stat">收錄情報<b id="total">—</b></div><div class="stat">YouTube 情報<b id="youtube">—</b></div><div class="stat">兌換碼候選<b id="codes">—</b></div><div class="stat">最近執行<b id="last">—</b></div></div><div class="filters"><input id="search" placeholder="搜尋遊戲、標題、來源、攻略..."><select id="category"><option value="">所有分類</option><option>上市情報</option><option>兌換碼</option><option>攻略</option><option>更新公告</option><option>一般情報</option></select></div><p id="error"></p><div id="items" class="items"></div></main><script>
let all=[];const fmt=s=>s?new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}):'未知';function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};function render(){let q=document.querySelector('#search').value.toLowerCase(),cat=document.querySelector('#category').value;let rows=all.filter(x=>(!cat||x.tags.includes(cat))&&[x.title,x.summary,x.source,x.region].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.first_seen_at.localeCompare(a.first_seen_at)).slice(0,300);document.querySelector('#items').innerHTML=rows.map(x=>`<article class="item"><div class="small">${safe(x.source)} · ${safe(x.region)} · 首次發現 ${fmt(x.first_seen_at)}</div><h3><a href="${safe(x.url)}" target="_blank" rel="noopener noreferrer">${safe(x.title)}</a></h3><div>${x.tags.map(t=>`<span class="tag">${safe(t)}</span>`).join('')}</div><p>${safe(x.summary).slice(0,450)}</p><div class="small">來源發布：${fmt(x.published_at)} · 最後異動：${fmt(x.last_changed_at)}</div></article>`).join('')||'<p>目前沒有符合的資料。</p>'};Promise.all([fetch('items.json').then(r=>{if(!r.ok)throw Error('資料尚未建立');return r.json()}),fetch('status.json').then(r=>r.json())]).then(([items,status])=>{all=items;document.querySelector('#total').textContent=items.length;document.querySelector('#youtube').textContent=items.filter(x=>x.source.startsWith('YouTube')).length;document.querySelector('#codes').textContent=items.filter(x=>x.tags.includes('兌換碼')).length;document.querySelector('#last').textContent=fmt(status.last_run_at);if(status.failures?.length)document.querySelector('#error').textContent=`有 ${status.failures.length} 個來源檢查失敗，請查看 GitHub Actions 紀錄。`;render()}).catch(e=>document.querySelector('#error').textContent=e.message);document.querySelector('#search').addEventListener('input',render);document.querySelector('#category').addEventListener('change',render);
</script></body></html>
